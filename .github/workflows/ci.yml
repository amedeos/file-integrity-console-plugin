name: CI

on:
  push:
    # Release branches too: merging a pull request into one is a push, and
    # without this the branch tip that Quay builds from is never checked as a
    # whole — only the pull request that produced it was.
    branches: [main, 'release-*']
  pull_request:
  # Drift between `main` and a release branch is invisible from either side:
  # nothing touches the release branch when `main` moves, so its own CI never
  # runs and the divergence sits there. This is the only thing that notices.
  schedule:
    - cron: '17 6 * * *'

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: Source hygiene
    runs-on: ubuntu-latest
    # The nightly run exists only for the branch-delta drift check.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      # A raw control character in a source file makes git report it as binary
      # and makes grep skip it without saying anything, so a repository-wide
      # search can answer "no matches" while the matches sit in the file it
      # silently dropped. That is not hypothetical: a NUL reached
      # src/components/FileContentModal.tsx and hid three PatternFly class
      # names from exactly such a search.
      #
      # Every tracked file is scanned, because this repository has no binary
      # assets. If one is ever added, exclude it here deliberately rather than
      # loosening the check — a binary blob arriving in this tree is itself
      # worth a second look.
      #
      # Detection is `tr` plus `cmp`, not grep: grep skips a file it considers
      # binary even when asked to search it, which is the very behaviour being
      # guarded against here. Deleting NULs and comparing is immune to that.
      - name: No NUL bytes in tracked files
        run: |
          offenders=$(
            for f in $(git ls-files); do
              LC_ALL=C tr -d '\0' < "$f" | cmp -s - "$f" || echo "$f"
            done
          )
          if [ -n "$offenders" ]; then
            echo "These tracked files contain a NUL byte:"
            echo "$offenders" | sed 's/^/  /'
            echo
            echo "Write control characters as escapes, not as themselves."
            exit 1
          fi
          echo "$(git ls-files | wc -l) tracked files, none containing a NUL byte"

  # A release branch exists to differ from `main` in a handful of files and in
  # nothing else. Left to discipline, that holds until the first backend fix
  # written on the branch instead of merged into it, and from then on there are
  # two products rather than one built twice.
  #
  # The check is symmetric on purpose, and both directions matter:
  #
  #   - a path outside the declared set appears     -> the branch grew a
  #     divergence nobody agreed to;
  #   - a path inside the declared set is identical -> harmless, reported only.
  #
  # A fix landing on `main` also turns the branch red, because until it is
  # merged forward every file that fix touched *is* a difference. That is the
  # intended reading: not arriving is the failure, and it should be loud.
  branch-delta:
    name: Release branch delta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The comparison is against `main`, which a shallow checkout of a
          # release branch does not have.
          fetch-depth: 0

      - name: Fetch main and the release branches
        run: git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Nothing outside the declared delta
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const git = (...args) =>
            execFileSync('git', args, { encoding: 'utf8' })
              .split('\n')
              .filter(Boolean);

          const declared = JSON.parse(
            fs.readFileSync('.github/branch-delta.json', 'utf8'),
          );
          const isRelease = (b) => /^release-/.test(b ?? '');

          // On a pull request the checkout is the merge commit, so HEAD is what
          // the branch would become — which is the thing worth judging. On a
          // push it is the branch tip. The nightly run has no ref of its own
          // and sweeps every release branch instead.
          let targets;
          if (process.env.EVENT === 'schedule') {
            targets = git(
              'for-each-ref',
              '--format=%(refname:short)',
              'refs/remotes/origin/release-*',
            ).map((r) => ({ branch: r.replace(/^origin\//, ''), ref: r }));
          } else if (
            process.env.EVENT === 'pull_request' &&
            isRelease(process.env.BASE_REF)
          ) {
            targets = [{ branch: process.env.BASE_REF, ref: 'HEAD' }];
          } else if (isRelease(process.env.REF_NAME)) {
            targets = [{ branch: process.env.REF_NAME, ref: 'HEAD' }];
          } else {
            console.log('Not a release branch; nothing to compare.');
            process.exit(0);
          }

          let failed = false;
          for (const { branch, ref } of targets) {
            const entry = declared[branch];
            if (!entry) {
              console.error(
                `${branch} has no entry in .github/branch-delta.json.\n` +
                  'Declare what it is allowed to differ in, on `main`, before ' +
                  'pushing it.',
              );
              failed = true;
              continue;
            }

            const allowed = entry.paths;
            const changed = git('diff', '--name-only', 'origin/main', ref);
            const unexpected = changed.filter((f) => !allowed.includes(f));
            const unused = allowed.filter((f) => !changed.includes(f));

            if (unexpected.length) {
              failed = true;
              console.error(`\n${branch} differs from main outside its declared delta:`);
              unexpected.forEach((f) => console.error(`  ${f}`));
              console.error(
                '\nOne of two things is true.\n' +
                  '  - `main` moved and has not been merged forward. Merge it ' +
                  '(with a merge commit, never a squash) and this clears.\n' +
                  '  - the branch really did gain a new divergence. Then it is ' +
                  'a design decision: add the path to .github/branch-delta.json ' +
                  'on `main`, with the reason in the commit message.',
              );
            } else {
              console.log(
                `${branch}: ${changed.length} file(s) differ, all declared.`,
              );
            }

            if (unused.length) {
              console.log(
                `${branch}: declared but identical today — ${unused.join(', ')}`,
              );
            }
          }

          process.exit(failed ? 1 : 0);
          EOF

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    # The nightly run exists only for the branch-delta drift check.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # Yarn 4 is committed under .yarn/releases and pinned by packageManager,
      # so corepack uses exactly the version developers use. No global install.
      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Lint
        # The lint script passes --fix, which would hide a violation instead of
        # reporting it. In CI the sources are checked, not repaired.
        run: |
          yarn eslint src --max-warnings 0
          yarn stylelint 'src/**/*.css' --allow-empty-input

      - name: Typecheck
        run: yarn tsc --noEmit

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      # The plugin ships English and Italian. A string added to one catalogue
      # and not the other renders as a raw key to half the users, which nothing
      # else here would catch.
      - name: Locales in sync
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const load = (lang) =>
            Object.keys(
              JSON.parse(
                fs.readFileSync(
                  `locales/${lang}/plugin__file-integrity-console-plugin.json`,
                  'utf8',
                ),
              ),
            ).sort();
          const en = load('en');
          const it = load('it');
          const missing = en.filter((k) => !it.includes(k));
          const extra = it.filter((k) => !en.includes(k));
          if (missing.length || extra.length) {
            console.error('Missing from it:', missing);
            console.error('Not in en:', extra);
            process.exit(1);
          }
          console.log(`${en.length} keys, en and it agree`);
          EOF

      # src/lib/styles.ts is a table of strings that either match the stylesheet
      # the console loaded or do nothing at all — nothing type-checks them, and
      # a wrong one costs no error, no warning and no visible failure beyond a
      # colour that never applies. `pf-v6-u-color-200` sat there for weeks
      # exactly that way: a PatternFly 5 name carried across by a mechanical v5
      # to v6 swap, matching nothing in either PatternFly 6 stylesheet.
      #
      # @patternfly/patternfly is a devDependency for this step alone. It is
      # never imported and never bundled; it is pinned to the release the target
      # console loads, so this compares the names against the exact stylesheet
      # they have to survive. Each branch pins its own, which is what makes the
      # check mean something on all three.
      - name: Style names exist in the PatternFly stylesheet
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');

          // Only the quoted values, never the prose. The file's own comment
          // names a dead class as its cautionary example, and scanning the
          // whole text would fail the build over the warning about the bug.
          const source = fs.readFileSync('src/lib/styles.ts', 'utf8');
          const names = [
            ...new Set(
              (source.match(/'[^']*'/g) ?? []).flatMap(
                (literal) =>
                  literal.match(/pf-v\d+-[a-z0-9-]+|--pf-[a-z0-9-]+/g) ?? [],
              ),
            ),
          ];
          if (!names.length) {
            console.error('No PatternFly names found in src/lib/styles.ts.');
            process.exit(1);
          }

          // The utility classes live in patternfly-addons.css and the tokens in
          // patternfly.css; the console loads both, so either file counts.
          const root = path.dirname(
            require.resolve('@patternfly/patternfly/package.json'),
          );
          const version = require(
            path.join(root, 'package.json'),
          ).version;
          const css = ['patternfly.css', 'patternfly-addons.css']
            .map((f) => fs.readFileSync(path.join(root, f), 'utf8'))
            .join('\n');

          const dead = names.filter((n) => !css.includes(n));
          if (dead.length) {
            console.error(
              `These names are absent from @patternfly/patternfly ${version}:`,
            );
            dead.forEach((n) => console.error(`  ${n}`));
            console.error(
              '\nA name that matches nothing does not fail — it just never ' +
                'applies. Check the spelling against the stylesheet rather ' +
                'than against the previous major.',
            );
            process.exit(1);
          }
          console.log(
            `${names.length} names, all present in @patternfly/patternfly ${version}`,
          );
          EOF

      # A git tag names the released image, and the plugin manifest carries a
      # version of its own that the console displays. If these drift, a release
      # tagged v0.1.1 ships an image announcing itself as something else.
      - name: Versions agree
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const chart = fs.readFileSync(
            'charts/file-integrity-console-plugin/Chart.yaml',
            'utf8',
          );
          const appVersion = /^appVersion:\s*"?([^"\s]+)"?\s*$/m.exec(chart)?.[1];
          const found = {
            'package.json version': pkg.version,
            'consolePlugin.version': pkg.consolePlugin.version,
            'Chart.yaml appVersion': appVersion,
          };
          const distinct = [...new Set(Object.values(found))];
          if (distinct.length !== 1 || distinct[0] === undefined) {
            console.error('Versions disagree:', found);
            process.exit(1);
          }
          console.log(`version ${distinct[0]} everywhere`);
          EOF

  backend:
    name: Backend
    runs-on: ubuntu-latest
    # The nightly run exists only for the branch-delta drift check.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet
        working-directory: backend
        run: go vet ./...

      # No -race: the only tests today are pure functions in internal/policy, so
      # it would cost a cgo toolchain and find nothing. Add it together with the
      # first test that starts a goroutine.
      - name: Test
        working-directory: backend
        run: go test ./...

      - name: Build
        working-directory: backend
        run: go build ./...

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    # The nightly run exists only for the branch-delta drift check.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Lint
        run: helm lint charts/file-integrity-console-plugin --set plugin.image=example.io/plugin:ci

      # Rendering with --set only ever produced strings, which is how a default
      # of 1048576 reached a cluster as "1.048576e+06" and crash-looped the pod:
      # Helm parses YAML numbers as float64. These render the *defaults*.
      #
      # The tunable settings are environment variables rather than flags — a
      # Subscription can override a container's env but not its args, so as
      # flags they were unreachable from an OperatorHub install. The float64
      # trap is unchanged by that: a value is a value wherever it is written.
      - name: Render with defaults
        run: |
          helm template ci charts/file-integrity-console-plugin \
            --namespace openshift-file-integrity \
            --set plugin.image=example.io/plugin:ci > /tmp/defaults.yaml
          grep -q -- 'value: "1048576"' /tmp/defaults.yaml
          # Comments are stripped first. The template carries a comment naming
          # 1.048576e+06 as the thing to avoid, and scanning the whole render
          # fails the build over its own warning — the same way the PatternFly
          # style check once failed over the prose beside the dead class.
          ! grep -vE '^\s*#' /tmp/defaults.yaml | grep -qE '[0-9]+\.[0-9]+e\+[0-9]+'

      # File retrieve is on by default — it grants nobody anything, since every
      # read runs as the calling user and is refused without their own
      # `pods/exec`. Both positions are asserted, because the switch that has
      # never been rendered in one of its states is the one that turns out not
      # to work.
      - name: The file-retrieve switch renders both ways
        run: |
          grep -A 1 PLUGIN_ENABLE_FILE_RETRIEVE /tmp/defaults.yaml | grep -q 'value: "true"'
          helm template ci charts/file-integrity-console-plugin \
            --namespace openshift-file-integrity \
            --set plugin.image=example.io/plugin:ci \
            --set backend.features.fileRetrieve=false > /tmp/off.yaml
          grep -A 1 PLUGIN_ENABLE_FILE_RETRIEVE /tmp/off.yaml | grep -q 'value: "false"'
          # The proxy is declared either way. Dropping it when the feature is
          # off would make the console answer 404, which the UI can only report
          # as "no scan pod on this node" — the wrong reason entirely.
          grep -q 'authorization: UserToken' /tmp/off.yaml

      - name: Render with the deny list and a raised limit
        run: |
          helm template ci charts/file-integrity-console-plugin \
            --namespace openshift-file-integrity \
            --set plugin.image=example.io/plugin:ci \
            --set 'backend.extraDenyList={/etc/example/**}' \
            --set backend.maxFileBytes=2097152 > /tmp/retrieve.yaml
          grep -q -- 'value: "2097152"' /tmp/retrieve.yaml
          grep -q 'authorization: UserToken' /tmp/retrieve.yaml
          grep -q 'extra-deny-list.txt' /tmp/retrieve.yaml

      # Every setting the values file exposes has to actually reach the
      # container, and the environment is now the only route for most of them.
      # A value renamed in the template and not in the binary — or the other way
      # round — leaves an installation silently running the default.
      - name: Tunable settings reach the container as environment
        run: |
          helm template ci charts/file-integrity-console-plugin \
            --namespace openshift-file-integrity \
            --set plugin.image=example.io/plugin:ci > /tmp/env.yaml
          for name in PLUGIN_FIO_NAMESPACE PLUGIN_MAX_FILE_BYTES PLUGIN_ENABLE_FILE_RETRIEVE; do
            grep -q "name: $name" /tmp/env.yaml || {
              echo "$name is not rendered; an OLM install cannot reach that setting"
              exit 1
            }
            # The env name is the flag name mechanically transformed, so the
            # flag it claims to configure has to exist. Otherwise the chart
            # renders a variable the binary reads nothing from, and the
            # installation runs the default while appearing configured.
            flag=$(echo "${name#PLUGIN_}" | tr 'A-Z_' 'a-z-')
            grep -q "\"$flag\"" backend/cmd/server/main.go || {
              echo "$name maps to --$flag, which the binary does not define"
              exit 1
            }
          done

      # The backend's ServiceAccount is deliberately bound to no role at all;
      # everything it does runs as the calling user. A rule appearing here is a
      # design change, not a tweak, so make CI say so out loud.
      - name: No RBAC for the plugin ServiceAccount
        run: |
          helm template ci charts/file-integrity-console-plugin \
            --namespace openshift-file-integrity \
            --set plugin.image=example.io/plugin:ci \
            --set plugin.jobs.patchConsoles.enabled=false > /tmp/norbac.yaml
          ! grep -qE '^kind: (Cluster)?Role(Binding)?$' /tmp/norbac.yaml

  # The OLM bundle is generated from the chart rather than written beside it,
  # so there is only one description of what an installation creates. This job
  # is what keeps that true: it builds the bundle the way a release would and
  # then asks the same questions of it that the chart job asks of the chart.
  #
  # It is one job checking three different expected answers, because everything
  # it asserts is derived from the branch's own package.json — the version, the
  # OpenShift range, the channel. Nothing here is per-branch, which is why
  # ci.yml can stay a path that must never diverge.
  bundle:
    name: OLM bundle
    runs-on: ubuntu-latest
    # The nightly run exists only for the branch-delta drift check.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Install operator-sdk
        run: |
          curl -sfL -o /usr/local/bin/operator-sdk \
            https://github.com/operator-framework/operator-sdk/releases/download/v1.42.3/operator-sdk_linux_amd64
          chmod +x /usr/local/bin/operator-sdk

      - name: Generate
        # A fixed timestamp so two runs of the same commit produce the same
        # bundle; a release sets its own.
        run: BUNDLE_CREATED_AT=2000-01-01T00:00:00Z node hack/bundle/build-bundle.mjs

      - name: Validate
        run: |
          operator-sdk bundle validate ./dist/bundle \
            --select-optional suite=operatorframework
          operator-sdk bundle validate ./dist/bundle --select-optional name=community

      # Everything below reads the generated bundle rather than trusting the
      # generator. Each assertion is one that has already been got wrong once,
      # here or in the chart.
      - name: The bundle says what this branch is
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const yaml = require('js-yaml');

          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const dir = 'dist/bundle/manifests';
          const read = (f) => yaml.load(fs.readFileSync(f, 'utf8'));

          const csv = read(`${dir}/file-integrity-console-plugin.v${version}.clusterserviceversion.yaml`);
          const meta = read('dist/bundle/metadata/annotations.yaml').annotations;

          // The generation table lives in the generator, on `main`. This is the
          // independent statement of the same thing: a branch whose version says
          // 4.16 must not publish a bundle offered to a 4.22 catalogue.
          const expected = {
            '-ocp4.16': { range: 'v4.16-v4.18', channel: 'stable-4.16' },
            '-ocp4.19': { range: 'v4.19-v4.21', channel: 'stable-4.19' },
            '': { range: 'v4.22', channel: 'stable-4.22' },
          };
          const suffix = Object.keys(expected).find((s) => s !== '' && version.endsWith(s)) ?? '';
          const want = expected[suffix];

          const fail = [];
          const check = (what, got, wanted) => {
            if (got !== wanted) fail.push(`${what}: ${got} — expected ${wanted}`);
          };

          check('csv version', csv.spec.version, version);
          check('openshift range', meta['com.redhat.openshift.versions'], want.range);
          check('channel', meta['operators.operatorframework.io.bundle.channels.v1'], want.channel);
          check(
            'default channel',
            meta['operators.operatorframework.io.bundle.channel.default.v1'],
            want.channel,
          );
          check(
            'container image',
            csv.metadata.annotations.containerImage,
            `quay.io/asalvati/file-integrity-console-plugin:${version}`,
          );

          // The annotation that makes the console offer the plugin at all.
          // Without it the operator installs and nothing appears, with no error
          // anywhere — which is the failure this repository keeps meeting.
          check(
            'console plugin annotation',
            csv.metadata.annotations['console.openshift.io/plugins'],
            '["file-integrity-console-plugin"]',
          );

          // OLM templates nothing inside a cluster-scoped manifest, so this
          // namespace is literal in the shipped bundle. If it ever stops
          // agreeing with the suggested namespace, the console cannot reach the
          // plugin's backend and the failure is a blank page.
          const plugin = read(
            `${dir}/file-integrity-console-plugin_console.openshift.io_v1_consoleplugin.yaml`,
          );
          check(
            'consoleplugin namespace',
            plugin.spec.backend.service.namespace,
            'openshift-file-integrity',
          );
          check(
            'suggested namespace',
            csv.metadata.annotations['operatorframework.io/suggested-namespace'],
            plugin.spec.backend.service.namespace,
          );

          if (fail.length) {
            fail.forEach((f) => console.error(`  ${f}`));
            process.exit(1);
          }
          console.log(`${version}: ${want.range}, channel ${want.channel}, all as declared`);
          EOF

      # The counterpart of the chart's "No RBAC for the plugin ServiceAccount",
      # and it cannot be spelled the same way. OLM creates the ServiceAccount
      # only from `permissions`, and turns every entry there into a Role and a
      # RoleBinding whatever its rules — so the bundle has to declare one entry
      # to get an account at all, and the invariant becomes the emptiness of its
      # rules rather than the absence of the block.
      #
      # Read rather than grepped, because "rules: []" is the whole assertion and
      # a grep for it would pass just as happily on a rule added underneath.
      - name: The plugin ServiceAccount is granted nothing
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const yaml = require('js-yaml');
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const csv = yaml.load(
            fs.readFileSync(
              `dist/bundle/manifests/file-integrity-console-plugin.v${version}.clusterserviceversion.yaml`,
              'utf8',
            ),
          );
          const { permissions = [], clusterPermissions = [] } = csv.spec.install.spec;

          const fail = [];
          if (clusterPermissions.length) {
            fail.push('the CSV declares clusterPermissions; it must declare none');
          }
          if (permissions.length !== 1) {
            fail.push(`${permissions.length} permissions entries; expected exactly one`);
          }
          for (const p of permissions) {
            if ((p.rules ?? []).length) {
              fail.push(
                `${p.serviceAccountName} is granted ${p.rules.length} rule(s); it must be granted none. ` +
                  'Everything the backend does against the API server runs as the calling user, so a ' +
                  "rule here means something has started using the pod's identity instead.",
              );
            }
          }
          if (fail.length) {
            fail.forEach((f) => console.error(`  ${f}`));
            process.exit(1);
          }
          console.log(
            `${permissions[0].serviceAccountName}: no rules, no clusterPermissions`,
          );
          EOF
          ! grep -rqE '^kind: (Cluster)?Role(Binding)?$' dist/bundle/manifests/

  image:
    name: Container image
    runs-on: ubuntu-latest
    # The nightly run exists only for the branch-delta drift check.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      # Build only; nothing is pushed from CI. Catches the case where the
      # sources compile locally but a stage of the Containerfile does not.
      - name: Build
        run: podman build -f Containerfile -t file-integrity-console-plugin:ci .

      - name: Binary runs and serves its assets
        run: |
          podman run -d --name plugin -p 9443:9443 \
            file-integrity-console-plugin:ci \
            --tls-cert-file= --tls-key-file= --listen=:9443
          for i in $(seq 1 30); do
            curl -sf http://localhost:9443/healthz && break
            sleep 2
          done
          curl -sf http://localhost:9443/plugin-manifest.json | grep -q file-integrity-console-plugin
          podman logs plugin
          podman rm -f plugin
