# The half of the ClusterServiceVersion that the Helm chart has no opinion
# about: what this thing is called, who publishes it, and how OLM should offer
# it. Everything describing *what gets created* comes from the chart instead —
# see hack/bundle/build-bundle.mjs — so there is only one description of the
# Deployment, the Service, the ServiceAccount and the ConsolePlugin in this
# repository, and the bundle cannot drift away from what `helm install` does.
#
# Fields the generator fills in and that are therefore absent here:
# metadata.name, spec.version, spec.install, and the annotations that carry the
# image reference and the build timestamp.
apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  # The image is built for linux/amd64 only — on another architecture the pod
  # fails with `exec format error`. Saying so here is what keeps the operator
  # off the catalogue of a cluster that cannot run it, instead of offering an
  # install that crash-loops. Multi-arch is cheap to add when someone needs it:
  # the web assets are architecture-independent and the Go binary is
  # CGO_ENABLED=0. Adding an architecture means adding its label here too.
  labels:
    operatorframework.io/arch.amd64: supported
    operatorframework.io/os.linux: supported
  annotations:
    capabilities: Basic Install
    categories: Security,Monitoring
    repository: https://github.com/amedeos/file-integrity-console-plugin
    support: https://github.com/amedeos/file-integrity-console-plugin/issues
    description: >-
      Node-by-node view of Red Hat File Integrity Operator (AIDE) scan results
      in the OpenShift console.

    # What makes the console offer the plugin at all. Without it the operator
    # installs and the plugin is never registered, so nothing appears.
    #
    # Note what this does *not* do on a community catalog. The console treats
    # only `redhat-operators` as trusted (isCatalogSourceTrusted in
    # frontend/packages/operator-lifecycle-manager/src/utils.tsx), so the
    # install form defaults this plugin to **disabled** and shows a warning.
    # Installing without touching that control leaves no menu entry. The README
    # says so first, and says how to enable it afterwards.
    console.openshift.io/plugins: '["file-integrity-console-plugin"]'

    # A suggestion, not a constraint — the install form pre-fills it and the
    # user may still choose another namespace. The ConsolePlugin this bundle
    # ships names the Service's namespace literally, because OLM templates
    # nothing inside a cluster-scoped manifest, so installing anywhere else
    # leaves the console unable to fetch the plugin's assets. It is also the
    # namespace the File Integrity Operator itself runs in, which is why it is
    # the natural answer rather than merely a convenient one.
    operatorframework.io/suggested-namespace: file-integrity-console-plugin
spec:
  displayName: File Integrity Console Plugin
  description: |
    A console plugin for the [File Integrity Operator][fio]: a node-by-node view
    of AIDE scan results, with the failing files parsed out of the operator's
    result ConfigMaps instead of read as raw log text.

    It adds a **Compute → File Integrity** entry to the administrator
    perspective, visible only on clusters where the `FileIntegrity` CRD exists.

    ## What it shows

    * **Overview** — every `FileIntegrityNodeStatus` in the cluster, its phase,
      and the count of files added, changed and removed.
    * **Node report** — the AIDE report for one node, parsed into a filterable
      table, with the attribute differences for each changed file. Both the AIDE
      0.16 (`CONTENTEX`) and 0.18 (`CONTENT_EX`) report grammars are read, and a
      report the operator truncated is labelled as truncated rather than shown
      as though it were complete.
    * **Re-initialise** — per node or cluster-wide, behind a confirmation that
      spells out that the current baseline is discarded.

    ## How it talks to the cluster

    **The request-serving path has no authority of its own.** Everything the
    backend does against the API server on behalf of a browsing user it does
    with that user's token, resolving the caller with `SelfSubjectReview` and
    checking rights with `SelfSubjectAccessReview`. A request arriving without a
    bearer token is rejected; it is never served with the plugin's own
    credentials.

    Its ServiceAccount holds **no namespaced rule at all**. Cluster-wide it
    holds **two, and they are about installing rather than about data**: it may
    create a `ConsolePlugin`, and it may read and update the one named after
    itself. That is how the plugin registers with the console, which it does at
    startup rather than through a shipped manifest — an OLM bundle cannot state
    the namespace it will be installed into, so the pod reads its own and fills
    it in. Neither rule reaches anything belonging to anyone.

    ## Reading files from nodes

    One feature reads the current contents of a file from a node, so a reported
    change can be looked at. It reads as though it grants something, and it does
    not: the read runs as the browsing user, is refused unless they hold
    `pods/exec` in the scan namespace, and is recorded against their name in the
    API server's audit log. A deny list — refusing keys, certificates, shadow
    files and the static pod resources — is checked before the caller is even
    authenticated, so probing it costs nothing and is attributed to no session.

    It can be switched off, and then the endpoint answers `501` and the backend
    builds no Kubernetes client at all. Set `PLUGIN_ENABLE_FILE_RETRIEVE` to
    `false` through the Subscription to do that.

    ## Before you install

    * **Install the [File Integrity Operator][fio] first.** This plugin displays
      what that operator produces and scans nothing itself. On a cluster with no
      `FileIntegrity` CRD the navigation entry stays hidden.
    * **It installs into its own namespace,** `file-integrity-console-plugin`,
      which the form offers by default and creates for you. It does not need to
      sit beside the File Integrity Operator: it reads that operator's objects
      through the browsing user's token, and where to look for them is a setting
      of its own. Any other namespace works too — the plugin reads the one it
      was installed into and registers with the console accordingly.
    * **Enable the plugin when the form asks.** OperatorHub defaults the *Console
      plugin* choice to **Disabled** for any catalogue it does not trust, which
      includes the community one. Left that way, the operator runs and no menu
      entry appears. To enable it after the fact:

      ```
      oc patch console.operator.openshift.io cluster --type=json \
        -p '[{"op":"add","path":"/spec/plugins/-","value":"file-integrity-console-plugin"}]'
      ```

    Uninstalling leaves the cluster-scoped `ConsolePlugin` behind, because a
    bundle cannot ship the Job that would remove it. Delete it by hand:
    `oc delete consoleplugin file-integrity-console-plugin`.

    [fio]: https://github.com/openshift/file-integrity-operator

  keywords:
    - file integrity
    - aide
    - security
    - compliance
    - console plugin

  maturity: alpha

  provider:
    name: Amedeo Salvati
    url: https://github.com/amedeos/file-integrity-console-plugin

  # A forwarding alias rather than a personal address. This field is published
  # in a public catalogue and shown in OperatorHub, so it is indexed and cannot
  # be withdrawn from where it has already been copied. It still has to be an
  # address someone reads: it is where a user or a reviewer writes when
  # something breaks, possibly years from now.
  maintainers:
    - name: Amedeo Salvati
      email: cops.capable425@passmail.net

  links:
    - name: Source
      url: https://github.com/amedeos/file-integrity-console-plugin
    - name: Documentation
      url: https://github.com/amedeos/file-integrity-console-plugin#readme
    - name: File Integrity Operator
      url: https://github.com/openshift/file-integrity-operator

  # OwnNamespace and nothing else. An install mode ordinarily declares which
  # namespaces an operator watches, and this one watches none — no controller,
  # no informer, every API-server call made with the browsing user's token. So
  # the mode is not describing a watch scope here. It is describing the only
  # thing that actually varies: **where the pod ends up**.
  #
  # It is no longer fixed — 0.2.0 made the pod read its own namespace and
  # register for that one, so any namespace works. What is still worth choosing
  # is the *default*, and AllNamespaces would not let us choose: it puts the pod
  # in `openshift-operators`, shared with every other globally-installed
  # operator, where a namespaced rule granted to something else for its own
  # reasons is inherited by whatever else lives there. This plugin is built
  # around holding no namespaced rule at all; landing it in a shared namespace
  # gives that away for nothing. SingleNamespace and MultiNamespace let the
  # pod's namespace and the watched one differ, which is meaningless here —
  # this operator watches nothing.
  #
  # So: OwnNamespace, plus a suggested namespace of its own,
  # `file-integrity-console-plugin`. Not an `openshift-` name, which is reserved
  # for the cluster's own alongside `kube-` and refused to anyone who is not
  # cluster-admin.
  #
  # One observed fact, which is why this is spelled out rather than left to the
  # obvious guess: the console does not pick the workable install mode. It
  # reduces over the supported ones and prefers AllNamespaces whenever it is
  # offered at all (operator-hub-subscribe.tsx), then applies the suggested
  # namespace to that choice. Merely *supporting* the other modes would
  # therefore change nothing about what a user gets by default.
  #
  # With the global mode withdrawn, the form falls to "A specific namespace on
  # the cluster" and pre-selects *Operator recommended Namespace*
  # (`useSuggestedNSForSingleInstallMode` starts true), creating it. One click.
  #
  # Until 0.2.0 this block argued for `openshift-file-integrity` instead, and
  # the argument was sound while a shipped ConsolePlugin had to name a namespace
  # it could not know. That is worth knowing before rearranging it back.
  installModes:
    - type: OwnNamespace
      supported: true
    - type: SingleNamespace
      supported: false
    - type: MultiNamespace
      supported: false
    - type: AllNamespaces
      supported: false

  # None. This operator installs a console plugin and owns no API.
  customresourcedefinitions: {}
