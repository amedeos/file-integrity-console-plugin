---
plugin:
  # The ConsolePlugin resource name. It is part of the URL the frontend uses to
  # reach its own backend (`/api/proxy/plugin/<name>/fio-backend`, see
  # src/constants.ts), so changing it breaks the file-retrieve feature unless
  # PLUGIN_NAME is changed to match. Empty means the chart name.
  name: ""
  description: "File Integrity"
  image: ""
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  replicas: 2
  port: 9443
  securityContext:
    enabled: true
  podSecurityContext:
    enabled: true
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    enabled: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 10m
      memory: 50Mi
    limits:
      memory: 256Mi
  basePath: /
  # Empty means the service-serving-certificate operator issues the certificate
  # into "<name>-cert". Set it to use a certificate you manage yourself.
  certificateSecretName: ""
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  patcherServiceAccount:
    create: true
    annotations: {}
    name: ""
  jobs:
    patchConsoles:
      enabled: true
      image: "registry.redhat.io/openshift4/ose-tools-rhel9@sha256:ee65b244fc94d5765514c604dc0a288517dcdce68de65128d047622b6b30a618"
      podSecurityContext:
        enabled: true
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        enabled: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 50Mi

backend:
  # Namespace the File Integrity Operator runs its scans in. The backend looks
  # for the AIDE pod of a node here, and checks the caller's pods/exec rights
  # against this namespace.
  fileIntegrityNamespace: openshift-file-integrity

  features:
    # Reading a file off a node means exec'ing into the privileged AIDE pod,
    # which bind-mounts the node root — so this reads like a switch that grants
    # something. It does not. Every read is made with the browsing user's own
    # token: the backend checks their `pods/exec` rights in the scan namespace
    # with SelfSubjectAccessReview, refuses the deny-listed paths whoever asks,
    # and the kube-apiserver audit log records the exec against their name.
    # Turning it off does not take a permission away from anyone; it only makes
    # the endpoint answer 501 to people who were already entitled to the answer.
    #
    # On by default for that reason: a node report that shows a file changed and
    # cannot show what it now contains is half a feature, and the half that is
    # missing is the one an administrator opens the page for.
    #
    # Set it to false where the path should not exist at all. Then the endpoint
    # answers 501 with a message the UI renders as "feature disabled", and the
    # backend never even builds a Kubernetes client.
    fileRetrieve: true

  # Largest amount of bytes returned from a node file. Anything beyond is cut
  # and the response is flagged truncated.
  maxFileBytes: 1048576

  # Paths the backend refuses to read, whoever asks. Empty means the built-in
  # defaults compiled into the binary (see backend/internal/policy/policy.go:
  # /etc/kubernetes/static-pod-resources/**, **/*.key, **/*.pem, **/.ssh/**,
  # **/shadow and friends). Setting this REPLACES those defaults — to keep them
  # and add your own, use extraDenyList instead.
  denyList: []

  # Globs added to whichever list is in effect. This is the safe way to harden:
  # copying the defaults into denyList is how a copy goes stale and starts
  # allowing what a newer default would have denied.
  extraDenyList: []
  #  - "/etc/my-app/**/*.secret"
