{{- if .Values.plugin.serviceAccount.create -}}
# No Role or ClusterRole is bound to this account, on purpose.
#
# Everything the backend does against the API server it does with the calling
# user's token: it resolves the caller with SelfSubjectReview and checks
# pods/exec with SelfSubjectAccessReview, both of which run as the user and
# need no privileges of their own. Granting this account any read access to
# pods or nodes would create exactly the confused-deputy path the design
# avoids. If you find yourself needing to add rules here, something upstream
# has started using the pod's identity instead of the caller's.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "file-integrity-console-plugin.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "file-integrity-console-plugin.labels" . | nindent 4 }}
  {{- with .Values.plugin.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
