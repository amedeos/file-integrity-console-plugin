{{- if .Values.plugin.jobs.patchConsoles.enabled }}
# Counterpart of the post-install patch: on uninstall, take the plugin back out
# of the console's plugin list. Without this, `helm uninstall` leaves a name
# behind that resolves to nothing, and the console logs a failed plugin load on
# every page view.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "file-integrity-console-plugin.patcherName" . }}-cleanup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "file-integrity-console-plugin.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  parallelism: 1
  backoffLimit: 4
  template:
    metadata:
      labels:
        {{- include "file-integrity-console-plugin.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ template "file-integrity-console-plugin.patcherServiceAccountName" . }}
      {{- if and (.Values.plugin.securityContext.enabled) (.Values.plugin.jobs.patchConsoles.podSecurityContext.enabled) }}
      securityContext: {{ tpl (toYaml (omit .Values.plugin.jobs.patchConsoles.podSecurityContext "enabled")) $ | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 400
      dnsPolicy: ClusterFirst
      containers:
        - name: {{ template "file-integrity-console-plugin.patcherName" . }}-cleanup
          image: {{ required "Patcher image must be specified!" .Values.plugin.jobs.patchConsoles.image }}
          {{- if and (.Values.plugin.securityContext.enabled) (.Values.plugin.jobs.patchConsoles.containerSecurityContext) }}
          securityContext: {{ tpl (toYaml (omit .Values.plugin.jobs.patchConsoles.containerSecurityContext "enabled")) $ | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.plugin.jobs.patchConsoles.resources | nindent 12 }}
          command:
            - /bin/bash
            - -c
            - |
                set -euo pipefail
                existingPlugins=$(oc get consoles.operator.openshift.io cluster -o json | jq -c '.spec.plugins // []')
                remainingPlugins=$(jq --argjson existingPlugins "${existingPlugins}" --argjson consolePlugin '["{{ template "file-integrity-console-plugin.name" . }}"]' -c -n '$existingPlugins - $consolePlugin')
                patchedPlugins=$(jq --argjson remainingPlugins "${remainingPlugins}" -n -c '{ "spec": { "plugins": $remainingPlugins } }')
                oc patch consoles.operator.openshift.io cluster --patch "${patchedPlugins}" --type=merge
{{- end }}
